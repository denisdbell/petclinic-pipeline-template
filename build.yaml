parameters:
  - name: jdkVersion
    type: string
    default: '1.17'
  - name: devAcrConnection
    type: string
  - name: imageRepository
    type: string
  - name: sonarServiceConnection
    type: string
  - name: sonarProjectKey
    type: string
  - name: sonarProjectName
    type: string

steps:
# 1. Prepare SonarQube Analysis
- task: SonarQubePrepare@7
  displayName: 'Prepare SonarQube Analysis'
  inputs:
    SonarQube: ${{ parameters.sonarServiceConnection }}
    scannerMode: 'Other'
    extraProperties: |
      sonar.projectKey=${{ parameters.sonarProjectKey }}
      sonar.projectName=${{ parameters.sonarProjectName }}

# 2. Maven Build & Test (AND Analyze)
- task: Maven@3
  displayName: 'Maven Build & Test & Analyze'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    # CRITICAL FIX: Explicitly empty the branch name to bypass the Community Edition license check
    options: '-Dsonar.branch.name='
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: ${{ parameters.jdkVersion }}
    sqAnalysisEnabled: true 

# 3. Publish Quality Gate Result
- task: SonarQubePublish@7
  displayName: 'Publish Quality Gate Result'
  inputs:
    pollingTimeoutSec: '300'

# 4. Build and Push directly to the Dev ACR
- task: Docker@2
  displayName: 'Build and Push to Dev ACR'
  inputs:
    containerRegistry: ${{ parameters.devAcrConnection }}
    repository: ${{ parameters.imageRepository }}
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest