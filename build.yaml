parameters:
- name: jdkVersion
  type: string
  default: '1.17'
- name: imageRepository
  type: string
- name: imageTag
  type: string
- name: sonarServiceConnection
  type: string
- name: sonarOrganization
  type: string
- name: sonarProjectKey
  type: string

steps:
- task: SonarCloudPrepare@1
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarCloud: ${{ parameters.sonarServiceConnection }}
    organization: ${{ parameters.sonarOrganization }}
    scannerMode: 'Other'
    extraProperties: |
      sonar.projectKey=${{ parameters.sonarProjectKey }}
      sonar.projectName=${{ parameters.sonarProjectKey }}

- task: Maven@3
  displayName: 'Maven Build & Test'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package' 
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: ${{ parameters.jdkVersion }}

- task: SonarCloudAnalyze@1
  displayName: 'Run SonarCloud Analysis'

- task: SonarCloudPublish@1
  displayName: 'Publish Quality Gate Result'
  inputs:
    pollingTimeoutSec: '300'

# Build the image locally (Command: build, not buildAndPush)
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    command: 'build'
    repository: ${{ parameters.imageRepository }}
    Dockerfile: '**/Dockerfile'
    tags: ${{ parameters.imageTag }}

# Export the built image to a tar file
- script: |
    docker save ${{ parameters.imageRepository }}:${{ parameters.imageTag }} -o $(Build.ArtifactStagingDirectory)/image.tar
  displayName: 'Save Docker Image to Tar'

# Publish the tar file so deployment stages can use it
- task: PublishPipelineArtifact@1
  displayName: 'Publish Docker Image Artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/image.tar'
    artifact: 'docker-image'
