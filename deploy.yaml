parameters:
- name: environmentName
- name: azureServiceConnection
- name: webAppName
- name: acrServiceConnection
- name: acrLoginServer
- name: imageRepository
- name: imageTag

jobs:
- deployment: Deploy_${{ parameters.environmentName }}
  displayName: Deploy to ${{ parameters.environmentName }}
  environment: ${{ parameters.environmentName }}
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    runOnce:
      deploy:
        steps:
        # 1. Push the image to this specific environment's ACR
        - template: push-acr.yaml
          parameters:
            acrServiceConnection: ${{ parameters.acrServiceConnection }}
            acrLoginServer: ${{ parameters.acrLoginServer }}
            imageRepository: ${{ parameters.imageRepository }}
            imageTag: ${{ parameters.imageTag }}

        # 2. Deploy the container to the App Service
        - task: AzureWebAppContainer@1
          displayName: 'Deploy Container to Azure Web App: ${{ parameters.webAppName }}'
          inputs:
            azureSubscription: ${{ parameters.azureServiceConnection }}
            appName: ${{ parameters.webAppName }}
            imageName: '${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}'
