parameters:
- name: acrServiceConnection
  type: string
- name: acrLoginServer
  type: string
- name: imageRepository
  type: string
- name: imageTag
  type: string

steps:
# Download the artifact we published in the build stage
- download: current
  artifact: 'docker-image'
  displayName: 'Download Docker Image Artifact'

# Load the tar file back into the Docker daemon
- script: |
    docker load -i $(Pipeline.Workspace)/docker-image/image.tar
  displayName: 'Load Docker Image into Agent'

# Tag the generic image with the environment-specific ACR login server
- script: |
    docker tag ${{ parameters.imageRepository }}:${{ parameters.imageTag }} ${{ parameters.acrLoginServer }}/${{ parameters.imageRepository }}:${{ parameters.imageTag }}
  displayName: 'Tag Image for Target ACR'

# Push the tagged image to the environment ACR
- task: Docker@2
  displayName: 'Push to Environment ACR'
  inputs:
    containerRegistry: ${{ parameters.acrServiceConnection }}
    repository: ${{ parameters.imageRepository }}
    command: 'push'
    tags: ${{ parameters.imageTag }}
